<title>Independent.co.uk · Commercial Package · World Cup 2026 Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@300;400;500;600&amp;display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --bg2: #111820;
    --cyan: #e8001c;
    --cyan-dim: rgba(232,0,28,0.15);
    --red: #e8001c;
    --white: #ffffff;
    --gray: #8899aa;
    --border: rgba(255,255,255,0.08);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  /* ── SLIDE SHELL ── */
  .slide {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    position: relative;
    background: radial-gradient(ellipse 70% 60% at 80% 50%, rgba(232,0,28,0.05) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 10% 90%, rgba(180,0,20,0.04) 0%, transparent 60%),
                var(--bg);
  }

  /* ── TOP NAV BAR ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    height: 44px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-logo {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: var(--white);
  }
  .topbar-logo-icon {
    display: flex; align-items: center; flex-shrink: 0;
  }
  .topbar-dot { color: var(--gray); font-size: 11px; }
  .topbar-title { color: var(--gray); font-size: 12px; font-weight: 400; letter-spacing: 0.03em; }
  .topbar-slide { color: var(--gray); font-size: 12px; font-weight: 500; letter-spacing: 0.05em; }

  /* progress bar */
  .progress-bar {
    position: absolute; top: 44px; left: 0; right: 0; height: 2px;
    background: rgba(255,255,255,0.06);
  }
  .progress-fill {
    height: 100%; width: 5.26%; /* 1/19 */
    background: var(--cyan);
    transition: width 0.4s ease;
  }

  /* ── MAIN CONTENT ── */
  .content {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 120px;
    max-width: 900px;
  }

  /* pill badges */
  .badges { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--cyan);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
    color: var(--cyan);
    text-transform: uppercase;
    width: fit-content;
  }
  .badge-dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); flex-shrink: 0;
  }
  .badge-sep { color: rgba(232,0,28,0.5); margin: 0 4px; }

  /* logo */
  .logo-block {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 28px;
  }
  .logo-img { height: 56px; width: auto; }

  /* headline */
  .headline {
    font-family: 'Anton', sans-serif;
    font-size: 52px; line-height: 1.05;
    margin-bottom: 24px;
    letter-spacing: 0.01em;
  }
  .headline-white { color: var(--white); }
  .headline-cyan { color: var(--cyan); }

  /* subtitle */
  .subtitle {
    font-size: 15px; line-height: 1.65; color: rgba(255,255,255,0.65);
    max-width: 560px;
    margin-bottom: 40px;
  }

  /* footer tags */
  .footer-tags {
    display: flex; align-items: center; gap: 0;
    flex-wrap: wrap;
  }
  .footer-tag {
    font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 0.04em;
  }
  .footer-tag-sep {
    font-size: 11px; color: rgba(255,255,255,0.15); margin: 0 8px;
  }

  /* ── NAV ARROWS ── */
  .nav-arrow {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--gray);
    font-size: 16px; user-select: none;
    transition: background 0.2s, color 0.2s;
    z-index: 10;
  }
  .nav-arrow:hover { background: rgba(232,0,28,0.12); color: var(--cyan); }
  .nav-arrow.left { left: 20px; }
  .nav-arrow.right { right: 20px; }
  .nav-arrow.disabled { opacity: 0.2; pointer-events: none; }

  /* ── BOTTOM BAR ── */
  .bottombar {
    height: 44px; display: flex; align-items: center; justify-content: center;
    gap: 16px; flex-shrink: 0;
    border-top: 1px solid var(--border);
  }
  .bottom-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px; border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent; color: var(--gray);
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    cursor: pointer; text-transform: uppercase;
    transition: border-color 0.2s, color 0.2s;
  }
  .bottom-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .bottom-btn svg { width: 10px; height: 10px; fill: currentColor; }
  .bottom-sep { width: 1px; height: 20px; background: var(--border); }
</style>
</head>

    cursor: pointer; color: var(--gray); font-size: 16px;
    transition: background 0.2s, color 0.2s; z-index: 10;
  }
  .nav-arrow:hover { background: var(--red-dim); color: var(--red); }
  .nav-arrow.left { left: 20px; }
  .nav-arrow.right { right: 20px; }

  /* BOTTOM BAR */
  .bottombar {
    height: 44px; display: flex; align-items: center; justify-content: center;
    gap: 16px; flex-shrink: 0; border-top: 1px solid var(--border);
  }
  .bottom-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px; border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent; color: var(--gray);
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    cursor: pointer; text-transform: uppercase;
  }
  .bottom-btn:hover { border-color: var(--red); color: var(--red); }
  .bottom-sep { width: 1px; height: 20px; background: var(--border); }
</style>

  @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0d1117; --red:#e8001c; --red-dim:rgba(232,0,28,0.12); --white:#ffffff; --gray:#8899aa; --border:rgba(255,255,255,0.08); }
  html, body { width:100%; height:100%; background:var(--bg); color:var(--white); font-family:'Inter',sans-serif; overflow:hidden; }
  .slide { width:100vw; height:100vh; display:flex; flex-direction:column; background:radial-gradient(ellipse 60% 60% at 15% 50%, rgba(232,0,28,0.04) 0%, transparent 70%), var(--bg); }

  .topbar { display:flex; align-items:center; justify-content:space-between; padding:0 32px; height:44px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .topbar-left { display:flex; align-items:center; gap:12px; }
  .topbar-dot { color:var(--gray); font-size:11px; }
  .topbar-title { color:var(--gray); font-size:12px; font-weight:400; letter-spacing:0.03em; }
  .topbar-slide { color:var(--gray); font-size:12px; font-weight:500; letter-spacing:0.05em; }
  .progress-bar { position:absolute; top:44px; left:0; right:0; height:2px; background:rgba(255,255,255,0.06); }
  .progress-fill { height:100%; width:26.3%; background:var(--red); }

  .main { flex:1; display:grid; grid-template-columns:1fr 1fr; overflow:hidden; }

  /* LEFT panel */
  .left-panel { display:flex; align-items:center; justify-content:center; padding:28px 20px 28px 56px; }

  /* PAGE MOCKUP */
  .page-mockup {
    width:100%; max-width:380px;
    background:#f4f4f4;
    border-radius:10px;
    box-shadow:0 24px 64px rgba(0,0,0,0.6);
    overflow:hidden;
    font-family:Georgia,serif;
    position:relative;
  }

  /* Indie header */
  .indie-header { background:white; padding:7px 10px; border-bottom:2px solid #e8001c; display:flex; align-items:center; gap:6px; }
  .indie-eagle { width:14px; height:14px; background:#e8001c; border-radius:50%; flex-shrink:0; }
  .indie-wordmark { font-family:'Inter',sans-serif; font-weight:700; font-size:11px; color:#111; }
  .indie-nav { display:flex; gap:6px; margin-left:auto; }
  .indie-nav span { font-family:'Inter',sans-serif; font-size:7px; color:#555; }
  .indie-nav span.active { color:#e8001c; font-weight:700; border-bottom:1.5px solid #e8001c; }

  /* Page layout with sidebars */
  .page-body { display:flex; max-height:320px; overflow:hidden; }

  .sidebar-left {
    width:26px; flex-shrink:0; background:#e8001c;
    display:flex; align-items:center; justify-content:center;
    writing-mode:vertical-rl;
    font-family:'Inter',sans-serif; font-size:6.5px; font-weight:700;
    color:white; letter-spacing:0.12em; padding:6px 0;
    text-transform:uppercase;
  }

  .page-content { flex:1; padding:10px 8px; background:white; }
  .article-tag { font-family:'Inter',sans-serif; font-size:7px; color:#e8001c; margin-bottom:3px; }
  .article-title { font-size:12px; font-weight:700; color:#111; line-height:1.3; margin-bottom:5px; }
  .article-byline { font-family:'Inter',sans-serif; font-size:6.5px; color:#888; margin-bottom:7px; }

  .article-img {
    width:100%; height:52px;
    background:linear-gradient(135deg,#1a3a5c,#2d5986);
    border-radius:3px; margin-bottom:6px;
    display:flex; align-items:center; justify-content:center;
  }
  .article-img span { color:rgba(255,255,255,0.3); font-size:7px; font-family:'Inter',sans-serif; }

  .article-body { font-size:7px; color:#444; line-height:1.5; margin-bottom:8px; }

  /* In-article brand card */
  .in-article-card {
    background:#e8001c; border-radius:4px; padding:7px 9px;
    margin:7px 0; display:flex; align-items:center; justify-content:space-between;
    position:relative;
  }
  .iac-left .iac-brand { color:white; font-family:'Inter',sans-serif; font-weight:700; font-size:9.5px; }
  .iac-left .iac-offer { color:rgba(255,255,255,0.85); font-family:'Inter',sans-serif; font-size:7px; }
  .iac-cta { background:white; color:#e8001c; font-family:'Inter',sans-serif; font-size:7.5px; font-weight:700; padding:4px 7px; border-radius:3px; white-space:nowrap; }

  .article-body-2 { font-size:7px; color:#444; line-height:1.5; }

  .sidebar-right {
    width:26px; flex-shrink:0; background:#e8001c;
    display:flex; align-items:center; justify-content:center;
    writing-mode:vertical-rl; transform:rotate(180deg);
    font-family:'Inter',sans-serif; font-size:6.5px; font-weight:700;
    color:white; letter-spacing:0.12em; padding:6px 0;
    text-transform:uppercase;
  }

  /* Placement labels */
  .placement-label {
    display:inline-block;
    background:rgba(232,0,28,0.15);
    border:1px solid rgba(232,0,28,0.4);
    color:#e8001c;
    font-family:'Inter',sans-serif; font-size:6px; font-weight:700;
    letter-spacing:0.1em; text-transform:uppercase;
    padding:1px 4px; border-radius:2px;
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    white-space:nowrap;
  }

  /* RIGHT PANEL */
  .right-panel { display:flex; flex-direction:column; justify-content:center; padding:40px 64px 40px 40px; }
  .headline { font-family:'Anton',sans-serif; font-size:46px; line-height:1.05; margin-bottom:28px; letter-spacing:0.01em; color:var(--white); }
  .headline span { color:var(--red); }
  .bullets { display:flex; flex-direction:column; gap:18px; margin-bottom:36px; }
  .bullet { display:flex; align-items:flex-start; gap:14px; font-size:13.5px; line-height:1.55; color:rgba(255,255,255,0.82); }
  .bullet-icon { width:20px; height:20px; border-radius:50%; border:1.5px solid var(--red); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .bullet-icon svg { width:10px; height:10px; }
  .bullet strong { color:var(--white); font-weight:600; }
  .tags { display:flex; gap:8px; flex-wrap:wrap; }
  .tag { padding:5px 14px; border-radius:999px; border:1px solid rgba(255,255,255,0.2); font-size:11px; font-weight:600; letter-spacing:0.08em; color:rgba(255,255,255,0.6); text-transform:uppercase; }
  .tag.active { border-color:var(--red); background:var(--red); color:var(--white); }

  .nav-arrow { position:fixed; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:rgba(255,255,255,0.04); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--gray); font-size:16px; transition:background 0.2s,color 0.2s; z-index:10; }
  .nav-arrow:hover { background:var(--red-dim); color:var(--red); }
  .nav-arrow.left { left:20px; }
  .nav-arrow.right { right:20px; }
  .bottombar { height:44px; display:flex; align-items:center; justify-content:center; gap:16px; flex-shrink:0; border-top:1px solid var(--border); }
  .bottom-btn { display:flex; align-items:center; gap:6px; padding:5px 14px; border-radius:4px; border:1px solid var(--border); background:transparent; color:var(--gray); font-size:11px; font-weight:600; letter-spacing:0.08em; cursor:pointer; text-transform:uppercase; }
  .bottom-btn:hover { border-color:var(--red); color:var(--red); }
  .bottom-sep { width:1px; height:20px; background:var(--border); }
</style>
</head>
