<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Independent.co.uk · Commercial Package · Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap');
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { --bg:#0d1117; --red:#e8001c; --white:#ffffff; --gray:#8899aa; --border:rgba(255,255,255,0.08); --card:rgba(255,255,255,0.04); }
  html, body { width:100%; height:100%; background:var(--bg); color:var(--white); font-family:'Inter',sans-serif; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:radial-gradient(ellipse 70% 60% at 50% 40%, rgba(232,0,28,0.05) 0%, transparent 70%), var(--bg); padding:20px; }

  .login-box { width:100%; max-width:420px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:40px 36px; }
  .logo-wrap { display:flex; justify-content:center; margin-bottom:32px; }
  .logo-wrap img { height:32px; width:auto; }

  .title { font-family:'Anton',sans-serif; font-size:28px; line-height:1.1; text-align:center; margin-bottom:8px; }
  .title span { color:var(--red); }
  .subtitle { font-size:13px; color:var(--gray); text-align:center; margin-bottom:32px; }

  .form-group { margin-bottom:18px; }
  .form-label { display:block; font-size:11px; font-weight:700; letter-spacing:0.1em; color:var(--gray); margin-bottom:8px; text-transform:uppercase; }
  .form-input {
    width:100%;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    color:var(--white);
    font-family:'Inter',sans-serif;
    font-size:14px;
    outline:none;
    transition:border-color 0.2s;
  }
  .form-input:focus { border-color:var(--red); }

  .submit-btn {
    width:100%; padding:14px;
    background:var(--red); color:var(--white);
    border:none; border-radius:8px;
    font-family:'Inter',sans-serif; font-size:14px; font-weight:600;
    letter-spacing:0.05em; cursor:pointer;
    margin-top:8px;
    transition:opacity 0.2s;
  }
  .submit-btn:hover { opacity:0.9; }
  .submit-btn:disabled { opacity:0.5; cursor:not-allowed; }

  .error { color:var(--red); font-size:12px; text-align:center; margin-top:14px; min-height:16px; }

  .footer { text-align:center; margin-top:24px; font-size:11px; color:rgba(255,255,255,0.3); letter-spacing:0.05em; }
</style>
</head>

    <div class="title">Commercial <span>Package.</span></div>
    <div class="subtitle">Sign in to view the World Cup 2026 Edition</div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="user">Username</label>
        <input class="form-input" type="text" id="user" name="user" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="pass">Password</label>
        <input class="form-input" type="password" id="pass" name="pass" autocomplete="current-password" required>
      </div>
      <button type="submit" class="submit-btn">Sign In</button>
      <div class="error" id="error"></div>
    </form>

    <div class="footer">Commercial Package · World Cup 2026 Edition</div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const submitBtn = form.querySelector('.submit-btn');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const user = document.getElementById('user').value.trim();
      const pass = document.getElementById('pass').value;
      try {
        const res = await fetch('/api/site-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user, pass }),
        });
        if (res.ok) {
          const params = new URLSearchParams(location.search);
          location.href = params.get('next') || '/';
        } else {
          errorEl.textContent = 'Incorrect username or password.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      } catch (err) {
        errorEl.textContent = 'Something went wrong. Try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
